  <text x="84" y="113" fill="#5b6b7c" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">CONFLUENCE</text>

  <rect x="312" y="76" width="336" height="460" rx="8" fill="#0e2440" fill-opacity="0.02" stroke="#0e2440" stroke-opacity="0.10" stroke-width="0.8"/>
