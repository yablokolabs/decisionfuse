  <text x="136" y="732" fill="#4a5b6e" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">Human gate</text>
  <line x1="248" y1="729" x2="280" y2="729" stroke="#4a5b6e" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="288" y="732" fill="#4a5b6e" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">Not yet written · read-only</text>
