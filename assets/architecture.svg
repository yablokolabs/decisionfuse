<svg viewBox="0 0 960 780" width="960" height="780" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arch-title arch-desc" font-family="'Geist', ui-sans-serif, system-ui, sans-serif">
  <title id="arch-title">DecisionFuse review pipeline</title>
  <desc id="arch-desc">A Confluence decision block is registered with a baseline, compared by a deterministic analysis consumer, validated against evidence spans, then reviewed in a Jira panel and written only after a permission-checked human approval.</desc>
