  <text x="414" y="89" fill="#5b6b7c" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">FORGE · SITE-SCOPED STORAGE</text>

  <rect x="688" y="100" width="240" height="400" rx="8" fill="#0e2440" fill-opacity="0.02" stroke="#0e2440" stroke-opacity="0.10" stroke-width="0.8"/>
  <rect x="696" y="104" width="40" height="12" rx="2" fill="#f7f5f0"/>
  <text x="716" y="113" fill="#5b6b7c" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">JIRA</text>

  <!-- connectors, before nodes -->
  <path d="M240,176 H288 Q296,176 296,168 V156 Q296,148 304,148 H336" fill="none" stroke="#4a5b6e" stroke-width="1.2" marker-end="url(#arrow)"/>
